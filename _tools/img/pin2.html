<!doctype html><html><head><meta charset="utf-8"><style>
/* WorkHourMath second-round pin: dark navy, so it reads as a new image next to round one. */
html,body{margin:0;width:1000px;height:1500px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
body{background:linear-gradient(rgba(255,255,255,.04) 2px,transparent 2px) 0 0/50px 50px,linear-gradient(90deg,rgba(255,255,255,.04) 2px,transparent 2px) 0 0/50px 50px,radial-gradient(800px 600px at 15% 0%,rgba(59,130,246,.45),transparent 60%),#0b1530;color:#f8fafc;position:relative}
.wrap{padding:84px 80px 0}
.logo{display:flex;align-items:center;gap:18px;font-size:42px;font-weight:700}
.logo b{color:#60a5fa}
.label{display:inline-block;margin-top:64px;border:3px solid #60a5fa;color:#bfdbfe;border-radius:999px;padding:10px 26px;font-size:28px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
h1{font-size:92px;line-height:1.04;margin:34px 0 0;letter-spacing:-2px;font-weight:800}
p{font-size:40px;line-height:1.3;color:#cbd5e1;margin:30px 0 0;max-width:840px}
.art{position:absolute;left:50%;bottom:250px;transform:translateX(-50%);width:330px;height:330px;border-radius:50%;background:rgba(255,255,255,.06);border:4px solid #60a5fa;box-shadow:none;display:flex;align-items:center;justify-content:center}
.art svg{width:220px;height:220px;color:#93c5fd}
.foot{position:absolute;left:0;right:0;bottom:0;height:170px;background:#f8fafc;color:#0f172a;display:flex;align-items:center;justify-content:space-between;padding:0 80px;box-sizing:border-box}
.cta{font-size:46px;font-weight:800;color:#1d4ed8}
.site{font-size:36px;font-weight:600;opacity:.95}
</style></head><body>
<div class="wrap">
  <div class="logo"><svg width="68" height="68" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#1d4ed8"/><circle cx="16" cy="16" r="9" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M16 10.5V16l3.6 2.2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>WorkHour<b>Math</b></span></div>
  <div class="label" id="label"></div>
  <h1 id="headline"></h1>
  <p id="sub"></p>
</div>
<div class="art"><svg id="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></svg></div>
<div class="foot"><span class="cta" id="cta"></span><span class="site">workhourmath.com</span></div>
<script>
var q = new URLSearchParams(location.hash.slice(1));
document.getElementById('label').textContent = q.get('l') || '';
document.getElementById('headline').textContent = q.get('h') || '';
document.getElementById('sub').textContent = q.get('s') || '';
document.getElementById('cta').textContent = (q.get('c') || '') + ' →';
document.getElementById('icon').innerHTML = q.get('i') || '';
// Long headlines shrink so they never run into the illustration.
var h = document.getElementById('headline'), size = 92;
while (h.getBoundingClientRect().bottom > 760 && size > 60) { size -= 4; h.style.fontSize = size + 'px'; }
</script>
</body></html>
